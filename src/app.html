<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<title>Habit</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#22c55e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Habit" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icons/192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/icons/512.png" />
		<script>
			(() => {
				// iOS Safari / PWA: kill pinch-zoom and double-tap-to-zoom (meta user-scalable is ignored on iOS).
				const prevent = (event) => event.preventDefault();
				for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
					document.addEventListener(t, prevent, { passive: false });
				}
				document.addEventListener(
					'touchmove',
					(event) => {
						if (event.touches.length > 1) event.preventDefault();
					},
					{ passive: false }
				);
				let lastTouchEnd = 0;
				document.addEventListener(
					'touchend',
					(event) => {
						const now = Date.now();
						if (now - lastTouchEnd <= 300) event.preventDefault();
						lastTouchEnd = now;
					},
					{ passive: false }
				);
			})();

			(() => {
				const RESET_KEY = 'habit-pwa-asset-reset';
				const IMPORT_FAILURE_RE =
					/Importing a module script failed|Failed to fetch dynamically imported module|Load failed/i;

				function showOfflineShellFallback() {
					const root = document.getElementById('app');
					if (!root || root.dataset.offlineFallback === '1') return;
					root.dataset.offlineFallback = '1';
					root.style.display = 'block';
					root.innerHTML =
						'<div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:1.5rem;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center">' +
						'<div style="max-width:20rem">' +
						'<p style="margin:0 0 0.5rem;font-size:1.125rem;font-weight:600">Habit</p>' +
						'<p style="margin:0;font-size:0.875rem;line-height:1.5;color:#94a3b8">Нет сети — приложение не загрузилось. Подключи интернет и открой снова.</p>' +
						'</div></div>';
				}

				async function resetPwaCaches() {
					if (typeof navigator !== 'undefined' && navigator.onLine === false) {
						showOfflineShellFallback();
						return;
					}
					if (sessionStorage.getItem(RESET_KEY) === '1') return;
					sessionStorage.setItem(RESET_KEY, '1');

					try {
						const registrations = await navigator.serviceWorker?.getRegistrations?.();
						await Promise.all(
							(registrations ?? []).map((registration) => registration.unregister())
						);
					} catch {
						/* ignore */
					}

					try {
						const keys = await caches?.keys?.();
						await Promise.all((keys ?? []).map((key) => caches.delete(key)));
					} catch {
						/* ignore */
					}

					const url = new URL(window.location.href);
					url.searchParams.set('pwa_reset', String(Date.now()));
					window.location.replace(url);
				}

				function onImportFailure() {
					void resetPwaCaches();
				}

				window.addEventListener('unhandledrejection', (event) => {
					if (IMPORT_FAILURE_RE.test(String(event.reason))) onImportFailure();
				});

				window.addEventListener(
					'error',
					(event) => {
						if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
							onImportFailure();
						}
					},
					true
				);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="text-fg antialiased">
		<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
